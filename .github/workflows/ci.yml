name: CI

# Lance le lint et les tests à chaque push et à chaque pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Format (Ruff)
        run: ruff format --check .

      # Aucun fichier .env sur la CI : les tests fournissent leur propre configuration.
      - name: Tests (pytest)
        run: pytest -v
